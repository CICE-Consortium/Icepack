name: icepack
channels:
  - conda-forge
  - nodefaults
dependencies:
# Core Runtime Environment
  - python=3.11
# Build dependencies
  - compilers
  - netcdf-fortran
  - netcdf4
  - make
# Plotting dependencies
  - gnuplot
# Python dependencies for building the HTML documentation
  - pip
  - pip:
    - -r ../../../doc/requirements.txt
