name: PR Label Slash Commands

# This workflow is triggered by comments on PRs and Issues.  It supports
# setting labels by the /label and /unlabel string in comment text boxes.
# It support both forward and backslash, single or double quotes, and ignores 
# cases and spaces. So
#
#    /label "Priority : high"
#
# and
#
#    \label 'priority:HIGH'
#
# and
#
#    \label priority:high
#
# should all turn on the "Priority: High" label.  /unlabel works the same
# but removes the label on the issue or PR.  It parses the comment and updates labels in the 
# order they occur in the comment. It adds a thumbs up or thumbs down to the comment 
# depending on the outcome of the labeling script.


on:
  issue_comment:
    types: [created]

jobs:
  manage-labels:
    # Run on Issues and Pull Requests, ignore bots and allow collaborators to use this
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Parse and Execute Validated Label Commands
        # Pinning actions/github-script@v7.0.1 by commit SHA
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const commentBody = context.payload.comment.body;
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commentId = context.payload.comment.id;

            // 1. Fetch all valid labels existing in the repository
            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );

            // Helper function to strip all whitespace and convert to lowercase for fuzzy lookup
            const normalizeKey = (str) => str.toLowerCase().replace(/\s+/g, '');

            // Map normalized keys (e.g., "type:bug") to exact repository label names (e.g., "Type: bug")
            const validLabelsMap = new Map(repoLabels.map(l => [normalizeKey(l.name), l.name]));

            // Regex matches: /label "label" OR /label label (and unlabel equivalents)
            // Supports both forward slashes (/label) and backslashes (\label)
            const commandRegex = /[/\\](label|unlabel)\s+(?:"([^"]+)"|'([^']+)'|([^\s\n]+))/gi;

            let successCount = 0;
            let errorCount = 0;

            // 2. Process commands sequentially in exact order of appearance
            for (const match of commentBody.matchAll(commandRegex)) {
              const command = match[1].toLowerCase();
              const rawTargetLabel = match[2] || match[3] || match[4];
              if (!rawTargetLabel) continue;

              const normalizedKey = normalizeKey(rawTargetLabel);
              const canonicalLabel = validLabelsMap.get(normalizedKey);

              // Strict Check: Validate that the normalized label matches a repo label
              if (!canonicalLabel) {
                console.log(`Skipped: Label "${rawTargetLabel}" (normalized: "${normalizedKey}") does not exist in repository.`);
                errorCount++;
                continue;
              }

              if (command === 'label') {
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    labels: [canonicalLabel]
                  });
                  successCount++;
                } catch (e) {
                  console.log(`Failed to add label "${canonicalLabel}":`, e.message);
                  errorCount++;
                }
              } else if (command === 'unlabel') {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: canonicalLabel
                  });
                  successCount++;
                } catch (e) {
                  if (e.status === 404) {
                    console.log(`Label "${canonicalLabel}" was already absent.`);
                    successCount++;
                  } else {
                    console.log(`Failed to remove label "${canonicalLabel}":`, e.message);
                    errorCount++;
                  }
                }
              }
            }

            // 3. React based on execution result
            if (successCount > 0 && errorCount === 0) {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: commentId, content: '+1'
              });
            } else if (errorCount > 0) {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: commentId, content: '-1'
              });
            }

