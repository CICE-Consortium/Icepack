name: GHActions

# This workflow is triggered on pushes, pull-requeust, and releases
# ghactions* branch names will trigger this to support development testing
# To Do: get it working with bash and ubuntu

on:
  push:
    branches:
      - main
      - 'Icepack*'
      - 'ghactions*'
  pull_request:
  release:
    types:
      - created

# Establish a secure, read-only baseline for the repository token
permissions:
  contents: read

defaults:
  run:
    shell: /bin/csh -e {0}

jobs:
  build:
    name: "IcepackTesting"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }} 
    strategy:
      fail-fast: false   # <-- Keeps other matrix jobs running if one fails
      matrix:
        os: [macos-latest, ubuntu-latest, macos-15]
#        os: [macos-latest]
#        os: [macos-15]
#        os: [ubuntu-latest]
        include: 
          - os: macos-latest
            envdef: macos
            testid: M00
            testsuites: "quicky_suite"
            experimental: true
          - os: macos-15
            envdef: macos
            testid: M15
#            testsuites: "travis_suite,io_suite"
            testsuites: "quick_suite"
            experimental: false
          - os: ubuntu-latest
            envdef: linux
            testid: L00
#            testsuites: "travis_suite,io_suite"
            testsuites: "quick_suite"
            experimental: false
    steps:
      - name: install macos xcode
        shell: /bin/bash {0}
        if: contains( matrix.envdef, 'macos')
        run: |
          XCODE_DEV_PATH=$(xcode-select -p)
          echo "XCODE_DEV_PATH = $XCODE_DEV_PATH"
          sudo xcode-select -s "$XCODE_DEV_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "xcrun --show-sdk-path: $(xcrun --show-sdk-path)"
      - name: install linux tcsh
        shell: /bin/bash {0}
        if: contains( matrix.envdef, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y tcsh
      - name: system info
        shell: /bin/bash {0}
        run: |
          type wget
          type curl
          type csh
          echo "readlink \$(which csh): $(python -c 'import os, sys; print os.path.realpath(sys.argv[1])' $(which csh))"
          echo "csh --version: $(csh --version)"
          echo "uname -a: $(uname -a)"
          echo "sw_vers: $(sw_vers)"
          echo "HOME: $HOME"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "OS: ${{ matrix.os }}"
          echo "TESTID: ${{ matrix.testid }}"
          echo "ENVDEF: ${{ matrix.envdef }}"
      - name: clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
      - name: create directories
        shell: /bin/bash {0}
        run: |
          ln -s "${GITHUB_WORKSPACE}/../Icepack" "${HOME}/icepack"
          mkdir -p ${HOME}/icepack-dirs/runs ${HOME}/icepack-dirs/baseline ${HOME}/icepack-dirs/input
#          ls -al ${HOME}/
#          ls -al ${GITHUB_WORKSPACE}/
      - name: check for tabs
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/icepack
          set cnt = 0
          set ffiles = `find -P columnphysics configuration/driver -iname "*.f*"`
          set cfiles = `find -P columnphysics configuration/driver -iname "*.c*"`
          foreach file ($ffiles $cfiles)
            set fcnt = `sed -n '/\t/p' $file | wc -l`
            @ cnt = $cnt + $fcnt
            if ($fcnt > 0) then
               echo "TAB found: $fcnt $file"
            endif
          end
          exit $cnt
      - name: setup conda env
        id: micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: configuration/scripts/machines/environment.yml
          cache-environment: true
          cache-environment-key: env-${{ runner.os }}-${{ hashFiles('configuration/scripts/machines/environment.yml', 'doc/requirements.txt') }}
          cache-environment-key-fallback: env-${{ runner.os }}-
          init-shell: none
      - name: activate conda env
        shell: /bin/bash {0}
        run: |
          echo "CONDA_PREFIX=${{ steps.micromamba.outputs.environment-path }}" >> $GITHUB_ENV
          echo "${{ steps.micromamba.outputs.environment-path }}/bin" >> $GITHUB_PATH
      - name: check conda env
        shell: /bin/bash {0}
        run: |
          which clang
          clang --version
          which gcc
          gcc --version
          which gfortran
          gfortran --version
          which make
          make --version
      - name: check setup case
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/icepack
          ./icepack.setup -m conda -e ${{ matrix.envdef }} -c case0${{ matrix.testid }} --pes 1x1 -s diag1
      - name: check setup test
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/icepack
          ./icepack.setup -m conda -e ${{ matrix.envdef }} --test smoke --testid c0${{ matrix.testid }}
#      - name: compile case
#        run: |
#          cd $HOME/icepack
#          ./icepack.setup -m conda -e ${{ matrix.envdef }} -c case1
#          cd case1
#          ./icepack.build
      - name: download input data
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/icepack-dirs/input
          wget --progress=dot:giga https://zenodo.org/record/3728287/files/Icepack_data-20200326.tar.gz
          # Hardened Checksum Integrity Phase
          set shaval = "eb706ec09d4d35d6da3a118c8cba79d7d727e3d6aed19568e24423b92d3ea6bc"
          set shacmp = `sha256sum Icepack_data-20200326.tar.gz | cut -f 1 -d " "`
          if ( "${shaval}" != "${shacmp}" ) then
            echo "Download sha256sum error"
            exit 1
          endif
          tar xvfz Icepack_data-20200326.tar.gz
          pwd
          ls -alR
#      - name: run case
#        run: |
#          cd $HOME/icepack
#          cd case1
#          ./icepack.run
      - name: run suite
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/icepack
          ./icepack.setup -m conda -e ${{ matrix.envdef }} --suite ${{ matrix.testsuites }} --testid ${{ matrix.testid }}
      - name: write output
        shell: /bin/csh -e {0}
        run: |
          cd $HOME/icepack
          ./.github/workflows/write_logfiles.csh
          cd testsuite.${{ matrix.testid }}
          ./results.csh
      - name: successful run
        if: ${{ success() }}
        run: |
          echo "${{ job.name }} PASSED"
      - name: trap failure
        if: ${{ failure() }}
        run: |
          echo "${{ job.name }} FAILED"
          exit 99
